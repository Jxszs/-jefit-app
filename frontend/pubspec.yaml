name: jefit_app
description: "Tu app de gym con estilo Symmetry + Cbum"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Estilo moderno (dark aesthetic)
  google_fonts: ^6.0.0
  flutter_animate: ^4.0.0
  iconsax: ^0.0.7
  cached_network_image: ^3.3.1
  # Supabase (auth + DB online)
  supabase_flutter: ^2.15.0
  # State management
  provider: ^6.1.2
  # Networking
  dio: ^5.4.3
  # Storage
  shared_preferences: ^2.2.2
  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
